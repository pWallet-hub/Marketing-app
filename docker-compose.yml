# Local stack for the marketing app: PostgreSQL and the backend. Keycloak and the AFS hub are not part of it,
# so sign-in cannot complete here; the health check, migrations and the access-denied path can be checked.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: marketing-local
      POSTGRES_DB: marketing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: ./backend/.env.local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
