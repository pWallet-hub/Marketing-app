# Production stack for Coolify (Docker Compose build pack, compose file /docker-compose.prod.yml).
# docker-compose.yml stays the local stack. Every value comes from the Coolify environment (backend/.env.example).
#
# One public address: give the `frontend` service the domain (e.g. https://marketing.afs-rwanda.org, port 80). nginx
# serves the app and proxies /api to the backend, so the SSO callback and the session cookie stay on that address.
# Deploy AFS Command Center first: it creates the shared `afs-internal` network the backend joins.
x-backend-env: &backend-env
  # Refuses to start with placeholder secrets or plain-HTTP addresses (backend/app/production.py).
  ENVIRONMENT: production
  DATABASE_URL: postgresql://marketing:${POSTGRES_PASSWORD}@db:5432/marketing
  SESSION_SECRET: ${SESSION_SECRET}
  SESSION_HTTPS_ONLY: "true"
  # Keycloak: public issuer for the browser and tokens; internal address for server-to-server calls (afs-internal).
  KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-https://sso.afs-rwanda.org}
  KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://afs-keycloak:8080}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-afs}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-marketing}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
  # This app's public address. Frontend and API share it; the SSO callback is PUBLIC_BASE_URL/api/auth/callback.
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  FRONTEND_ORIGIN: ${PUBLIC_BASE_URL}
  # AFS Command Center's backend on afs-internal. Its /api/internal/ routes are blocked on the public address, and the
  # host blocks containers from reaching its own public address anyway.
  COMMAND_CENTER_URL: ${COMMAND_CENTER_URL:-http://afs-command-center-backend:8000}
  AFS_SERVICE_TOKEN_MARKETING: ${AFS_SERVICE_TOKEN_MARKETING}
  # Mail (Resend). Without RESEND_API_KEY nothing is sent and campaigns wait in the queue.
  # RESEND_FROM is a bare address (noreply@...); the display name is RESEND_FROM_NAME.
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM: ${RESEND_FROM:-}
  RESEND_FROM_NAME: ${RESEND_FROM_NAME:-AFS}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  # Optional integrations: empty means the step is skipped.
  BIOCAP_ACCOUNT_URL: ${BIOCAP_ACCOUNT_URL:-}
  BIOCAP_ACCOUNT_TOKEN: ${BIOCAP_ACCOUNT_TOKEN:-}
  FORM_TARGET_URL: ${FORM_TARGET_URL:-}
  FORM_TARGET_TOKEN: ${FORM_TARGET_TOKEN:-}
  # Public pages (unsubscribe, forms): requests per minute per client. Coolify's Traefik and this app's nginx each add
  # an X-Forwarded-For entry, so the client is 2 from the end. Add one for each further proxy (e.g. Cloudflare).
  PUBLIC_RATE_LIMIT: ${PUBLIC_RATE_LIMIT:-30}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
  # Days to keep send records and form submissions; 0 keeps them. Set once the retention period is decided.
  SEND_LOG_RETENTION_DAYS: ${SEND_LOG_RETENTION_DAYS:-0}
  FORM_SUBMISSION_RETENTION_DAYS: ${FORM_SUBMISSION_RETENTION_DAYS:-0}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: marketing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment: *backend-env
    expose: ["8000"]
    # `afs` reaches Command Center (access check on every request) and Keycloak privately; see the networks section.
    networks: [default, afs]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Sends the mail queue through Resend. Waits for the backend, which applies the database migrations at startup.
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Daily pg_dump into the `backups` volume, keeping 14 days. It protects against mistakes (a wrong import or delete),
  # not against losing the server: copy the volume off the host as well. Restore:
  #   docker compose exec -T db pg_restore -U marketing -d marketing --clean --if-exists < marketing-YYYY-MM-DD.dump
  backup:
    image: postgres:16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          day=$$(date +%F)
          if pg_dump -h db -U marketing -d marketing -Fc -f /backups/partial.dump; then
            mv /backups/partial.dump /backups/marketing-$$day.dump && echo "backup written: $$day"
          else
            echo "backup FAILED: $$day"
          fi
          find /backups -name 'marketing-*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose: ["80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Shared with AFS Command Center, which creates it. Only the backend joins it.
  afs:
    name: afs-internal
    external: true

volumes:
  pgdata:
  backups:
