server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 3m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Browsers ignore this over plain HTTP, so it only takes effect on the HTTPS address.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Email images are hosted elsewhere (https), and the editor and previews show them.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # The backend is reached only through this proxy. Webhooks come from Resend, so they are allowed; everything
    # else under /api is the app's own API.
    # Docker's DNS, re-read every 10 seconds. A fixed proxy_pass host is resolved once at startup, so a redeployed
    # backend (new container address) would get 502s until this container restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
